name: Rust

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: write-all

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo update
    - name: Identify
      run: git config user.name gh_actions && git config user.email nil
    - name: Commit
      run: git add . && git commit -m "updated lockfile" && git push
