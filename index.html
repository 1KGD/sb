<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>LOADING...</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link data-trunk rel="copy-file" href="assets/debug.png"/>
    <link data-trunk rel="copy-file" href="assets/manifest.json"/>
    <link rel="manifest" href="manifest.json" />
    <link data-trunk rel="rust" data-bin="starbloom" data-initializer="src/bootstrap.mjs" />
    <base data-trunk-public-url />

    <style>
        body {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            outline: none;
            display: block;
            object-fit: contain;
            /* I don't know why this works, it just does */
            transform: scale(calc(min(100vw/256%, 100vh/256%)));
            position: absolute;
        }

        #loading-panel {
            margin: auto;
            color: white;
        }

        progress[value] {
            background-color: green;
        }

        progress:not([value]) {
            background-color: orange;
        }
    </style>
</head>

<body>
    <div id="loading-panel">
        <pre id="loading-bytes"></pre>
        <progress id="loading-progress"></progress>
    </div>
</body>

</html>
