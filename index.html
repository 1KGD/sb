<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>LOADING...</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link data-trunk rel="copy-file" href="assets/favicon.png" />
    <link data-trunk rel="copy-file" href="assets/manifest.json" />
    <link data-trunk rel="copy-file" href="src/sw.js" />
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
    <link data-trunk rel="rust" data-bin="starbloom" data-initializer="src/bootstrap.mjs" />
    <base data-trunk-public-url />

    <script>
        let swRegistration = null;

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("./sw.js")
                .then((reg) => {
                    swRegistration = reg;
                });
        }
    </script>

    <style>
        body {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            outline: none;
            display: block;
            object-fit: contain;
            /* I don't know why this works, it just does */
            transform: scale(calc(min(100vw/256%, 100vh/256%)));
            position: absolute;
        }

        #loading-panel {
            margin: auto;
            color: white;
        }

        #panic-message-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            /* When has a massive z-index ever failed? */
            z-index: 10000000;
            width: 100vw;
            height: 100vh;
        }

        #panic-message {
            margin: auto;
            background: white;
            padding: 4%;
            border-radius: 20px;
            overflow: scroll;
            max-width: 80%;
            max-height: 80%;
        }

        progress[value] {
            background-color: green;
        }

        progress:not([value]) {
            background-color: orange;
        }
    </style>
</head>

<body>
    <div id="panic-message-container">
        <div id="panic-message">
            <h1>ERROR</h1>
            <pre id="panic-message-message" style="color: red;"/>
        </div>
    </div>

    <div id="loading-panel">
        <pre id="loading-bytes"></pre>
        <progress id="loading-progress"></progress>
    </div>
</body>

</html>
